name: Step 11 - Four overlap exact-patch merge diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-collision-probe.yml"
      - "scripts/step11_overlap_merge_probe.py"
permissions:
  contents: read
jobs:
  inspect-patch-collisions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
      - name: Reconstruct four selected exact original patches and inspect collision merges
        run: python scripts/step11_overlap_merge_probe.py
      - name: Verify frozen source runner and labels untouched
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv
