name: SWE-ABS Smoke Test

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone SWE-ABS
        run: |
          git clone --depth 1 https://github.com/OpenAgentEval/SWE-ABS.git

      - name: Fix patch application logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "SWE-ABS/swe-bench/swebench/harness/run_evaluation.py"
          )

          text = path.read_text()

          old_cmds = '''GIT_APPLY_CMDS = [
              "git apply --verbose",
              "git apply --verbose --reject",
              "patch --batch --fuzz=5 -p1 -i",
          ]'''

          new_cmds = '''GIT_APPLY_CMDS = [
              "git apply --verbose",
              "git apply --verbose --3way",
              "patch --batch --forward --fuzz=5 -p1 -i",
          ]'''

          if old_cmds not in text:
              raise RuntimeError("Could not find original GIT_APPLY_CMDS block")

          text = text.replace(
              old_cmds,
              new_cmds,
              1
          )

          old_loop = '''        applied_patch = False
          for git_apply_cmd in GIT_APPLY_CMDS:
              val = container.exec_run(
                  f"{git_apply_cmd} {DOCKER_PATCH}",
                  workdir=DOCKER_WORKDIR,
                  user=DOCKER_USER,
              )
              if val.exit_code == 0:
                  logger.info(f"{APPLY_PATCH_PASS}:\\n{val.output.decode(UTF8)}")
                  applied_patch = True
                  break
              else:
                  logger.info(f"Failed to apply patch to container: {git_apply_cmd}")
          '''

          new_loop = '''        applied_patch = False
          for attempt, git_apply_cmd in enumerate(GIT_APPLY_CMDS):
              if attempt:
                  container.exec_run(
                      ["/bin/bash", "-lc", "git reset --hard HEAD && git clean -fd"],
                      workdir=DOCKER_WORKDIR,
                      user=DOCKER_USER,
                  )

              val = container.exec_run(
                  f"{git_apply_cmd} {DOCKER_PATCH}",
                  workdir=DOCKER_WORKDIR,
                  user=DOCKER_USER,
              )

              if val.exit_code == 0:
                  logger.info(f"{APPLY_PATCH_PASS}:\\n{val.output.decode(UTF8)}")
                  applied_patch = True
                  break
              else:
                  logger.info(f"Failed to apply patch to container: {git_apply_cmd}")
          '''

          if old_loop not in text:
              raise RuntimeError("Could not find original patch loop")

          text = text.replace(
              old_loop,
              new_loop,
              1
          )

          # Verify final file is valid Python
          compile(text, str(path), "exec")

          path.write_text(text)

          print("GIT_APPLY_CMDS replaced: OK")
          print("Patch retry loop replaced: OK")
          print("Python syntax check: OK")
          print("Safe patch logic installed")
          PY
          
      - name: Install SWE-bench harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ./SWE-ABS/swe-bench

      - name: Create exact prediction
        run: |
          python - <<'PY'
          import json
          from datasets import load_dataset

          ds = load_dataset(
              "tarsur385/swe-verified-gemini3-flash-trajectories",
              split="train"
          )

          rows = [
              r for r in ds
              if r["instance_id"] == "astropy__astropy-12907"
              and r["sample"] == 1
          ]

          assert len(rows) == 1
          r = rows[0]

          assert r["resolved"] is True
          assert r["patch"].strip()

          pred = {
              "instance_id": r["instance_id"],
              "model_name_or_path": "openhands-gemini3-flash-sample-1",
              "model_patch": r["patch"],
          }

          with open("one_prediction.jsonl", "w") as f:
              f.write(json.dumps(pred) + "\n")

          print("instance:", r["instance_id"])
          print("sample:", r["sample"])
          print("resolved:", r["resolved"])
          print("patch length:", len(r["patch"]))
          PY

      - name: Run SWE-ABS evaluation
        run: |
          set -o pipefail
          cd SWE-ABS/swe-bench

          python -m swebench.harness.run_evaluation \
            --dataset_name OpenAgentLab/SWE-Bench_Verified_ABS \
            --split test \
            --predictions_path ../../one_prediction.jsonl \
            --instance_ids astropy__astropy-12907 \
            --run_id gha_smoke_astropy_12907 \
            --max_workers 1 \
            --timeout 1800 \
            2>&1 | tee ../../gha_smoke.log

      - name: Show test output
        if: always()
        run: |
          echo "=== TEST OUTPUT FILES ==="
          find SWE-ABS/swe-bench/logs -name test_output.txt -print 2>/dev/null || true

          echo ""
          echo "=== PYTEST RESULT LINES ==="

          find SWE-ABS/swe-bench/logs -name test_output.txt -exec \
            grep -aE "PASSED|FAILED|ERROR|collected|passed in|failed in" {} \; \
            2>/dev/null || true
            
      - name: Show failure details
        if: always()
        run: |
          TEST_FILE=$(find SWE-ABS/swe-bench/logs -name test_output.txt | head -n 1)

          echo "=== FAILURE DETAILS ==="

          if [ -n "$TEST_FILE" ]; then
            sed -n '/=== FAILURES ===/,/short test summary info/p' "$TEST_FILE"
          else
            echo "No test_output.txt found"
          fi

      - name: Show failure details
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = list(Path("SWE-ABS/swe-bench/logs").rglob("test_output.txt"))

          print("=== FAILURE DETAILS ===")

          if not files:
              print("No test_output.txt found")
              raise SystemExit

          text = files[0].read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Remove ANSI colour codes
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)

          start = text.find("=== FAILURES ===")
          end = text.find("short test summary info")

          if start == -1:
              print("No FAILURES section found")
          else:
              if end == -1:
                  end = len(text)

              print(text[start:end])
          PY
      
      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweabs-smoke-logs
          path: |
            gha_smoke.log
            SWE-ABS/swe-bench/logs/
