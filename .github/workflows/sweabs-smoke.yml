name: SWE-ABS Final Smoke Test

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone SWE-ABS
        run: |
          git clone --depth 1 https://github.com/OpenAgentEval/SWE-ABS.git

          echo "=== SWE-ABS COMMIT ==="
          git -C SWE-ABS rev-parse HEAD

      - name: Backport safe patch application logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "SWE-ABS/swe-bench/swebench/harness/run_evaluation.py"
          )

          lines = path.read_text().splitlines()

          # ---------------------------------------------------------
          # 1. Replace bundled patch commands with the safer
          #    current SWE-bench command sequence.
          # ---------------------------------------------------------
          cmd_start = next(
              i for i, line in enumerate(lines)
              if line.strip() == "GIT_APPLY_CMDS = ["
          )

          cmd_end = next(
              i for i in range(cmd_start + 1, len(lines))
              if lines[i].strip() == "]"
          )

          base_indent = (
              lines[cmd_start][
                  :len(lines[cmd_start])
                  - len(lines[cmd_start].lstrip())
              ]
          )

          lines[cmd_start:cmd_end + 1] = [
              base_indent + "GIT_APPLY_CMDS = [",
              base_indent + '    "git apply --verbose",',
              base_indent + '    "git apply --verbose --3way",',
              base_indent + '    "git apply --verbose --reject",',
              base_indent
              + '    "patch --batch --forward --fuzz=5 -p1 -i",',
              base_indent + "]",
          ]

          # ---------------------------------------------------------
          # 2. Find bundled retry loop.
          # ---------------------------------------------------------
          loop_index = next(
              i for i, line in enumerate(lines)
              if line.strip()
              == "for git_apply_cmd in GIT_APPLY_CMDS:"
          )

          loop_indent = (
              lines[loop_index][
                  :len(lines[loop_index])
                  - len(lines[loop_index].lstrip())
              ]
          )

          child_indent = loop_indent + "    "

          lines[loop_index] = (
              loop_indent
              + "for attempt, git_apply_cmd "
              + "in enumerate(GIT_APPLY_CMDS):"
          )

          # ---------------------------------------------------------
          # 3. Restore clean tree before every fallback attempt.
          # ---------------------------------------------------------
          reset_block = [
              child_indent + "if attempt:",
              child_indent + "    container.exec_run(",
              child_indent
              + '        ["/bin/bash", "-c", '
              + '"git checkout -- . ; git clean -fd"],',
              child_indent + "        workdir=DOCKER_WORKDIR,",
              child_indent + "        user=DOCKER_USER,",
              child_indent + "    )",
          ]

          lines[loop_index + 1:loop_index + 1] = reset_block

          # ---------------------------------------------------------
          # 4. Add official-style reverse check before declaring
          #    total patch application failure.
          # ---------------------------------------------------------
          fail_index = next(
              i for i in range(loop_index + len(reset_block) + 1, len(lines))
              if lines[i].strip() == "if not applied_patch:"
          )

          fail_indent = (
              lines[fail_index][
                  :len(lines[fail_index])
                  - len(lines[fail_index].lstrip())
              ]
          )

          reverse_block = [
              fail_indent + "if not applied_patch:",
              fail_indent + "    reverse_check = container.exec_run(",
              fail_indent
              + '        f"git apply --check --reverse {DOCKER_PATCH}",',
              fail_indent + "        workdir=DOCKER_WORKDIR,",
              fail_indent + "        user=DOCKER_USER,",
              fail_indent + "    )",
              fail_indent + "    if reverse_check.exit_code == 0:",
              fail_indent
              + '        logger.info('
              + 'f"{APPLY_PATCH_PASS}: verified already applied")',
              fail_indent + "        applied_patch = True",
          ]

          lines[fail_index:fail_index] = reverse_block

          text = "\n".join(lines) + "\n"

          # ---------------------------------------------------------
          # 5. For audit logging use diff HEAD instead of plain diff.
          #    This lets the log include staged changes from --3way.
          # ---------------------------------------------------------
          old_diff = '"git -c core.fileMode=false diff"'
          new_diff = '"git -c core.fileMode=false diff HEAD"'

          diff_count = text.count(old_diff)

          if diff_count < 1:
              raise RuntimeError(
                  "Could not find git diff logging command"
              )

          text = text.replace(old_diff, new_diff)

          # ---------------------------------------------------------
          # 6. Safety checks.
          # ---------------------------------------------------------
          required = [
              '"git apply --verbose --3way"',
              '"git apply --verbose --reject"',
              '"patch --batch --forward --fuzz=5 -p1 -i"',
              "git checkout -- . ; git clean -fd",
              "git apply --check --reverse",
              "git -c core.fileMode=false diff HEAD",
          ]

          for item in required:
              assert item in text, item

          compile(text, str(path), "exec")
          path.write_text(text)

          print("Safe patch logic installed: OK")
          print("git diff HEAD audit logging installed: OK")
          print("Python syntax check: OK")
          PY

      - name: Install SWE-bench harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ./SWE-ABS/swe-bench

      - name: Create exact trajectory prediction
        run: |
          python - <<'PY'
          import json
          from datasets import load_dataset

          instance_id = "astropy__astropy-12907"
          sample = 1

          ds = load_dataset(
              "tarsur385/swe-verified-gemini3-flash-trajectories",
              split="train"
          )

          rows = [
              row for row in ds
              if row["instance_id"] == instance_id
              and row["sample"] == sample
          ]

          assert len(rows) == 1, (
              f"Expected exactly one trajectory, got {len(rows)}"
          )

          row = rows[0]

          assert row["resolved"] is True
          assert row["patch"].strip()

          prediction = {
              "instance_id": instance_id,
              "model_name_or_path":
                  "openhands-gemini3-flash-sample-1",
              "model_patch": row["patch"],
          }

          with open("one_prediction.jsonl", "w") as f:
              f.write(json.dumps(prediction) + "\n")

          print("instance_id:", instance_id)
          print("sample:", sample)
          print("standard evaluation resolved:", row["resolved"])
          print("patch characters:", len(row["patch"]))
          PY

      - name: Run SWE-ABS strengthened evaluation
        run: |
          set -o pipefail

          cd SWE-ABS/swe-bench

          python -m swebench.harness.run_evaluation \
            --dataset_name OpenAgentLab/SWE-Bench_Verified_ABS \
            --split test \
            --predictions_path ../../one_prediction.jsonl \
            --instance_ids astropy__astropy-12907 \
            --run_id final_smoke_astropy_12907 \
            --max_workers 1 \
            --timeout 1800 \
            2>&1 | tee ../../gha_smoke.log

      - name: Verify intended patch
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          logs = list(
              Path("SWE-ABS/swe-bench/logs").rglob(
                  "run_instance.log"
              )
          )

          if len(logs) != 1:
              raise RuntimeError(
                  f"Expected 1 run_instance.log, found {len(logs)}"
              )

          text = logs[0].read_text(
              encoding="utf-8",
              errors="replace"
          )

          start = text.find("Git diff before:")
          end = text.find("Eval script for", start)

          if start == -1:
              raise RuntimeError(
                  "Git diff before section not found"
              )

          if end == -1:
              raise RuntimeError(
                  "Could not find end of Git diff before section"
              )

          diff_before = text[start:end]

          print("=== GIT DIFF HEAD BEFORE TESTS ===")
          print(diff_before)

          required_file = (
              "diff --git "
              "a/astropy/modeling/separable.py "
              "b/astropy/modeling/separable.py"
          )

          required_old = (
              "cright[-right.shape[0]:, "
              "-right.shape[1]:] = 1"
          )

          required_new = (
              "cright[-right.shape[0]:, "
              "-right.shape[1]:] = right"
          )

          if required_file not in diff_before:
              raise RuntimeError(
                  "separable.py is missing from pre-test diff"
              )

          if required_old not in diff_before:
              raise RuntimeError(
                  "Expected old separable.py line is missing"
              )

          if required_new not in diff_before:
              raise RuntimeError(
                  "Expected '= right' fix is missing"
              )

          print("")
          print(
              "VERIFIED: intended separable.py patch "
              "is active before strengthened tests"
          )
          PY

      - name: Verify strengthened tests
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          outputs = list(
              Path("SWE-ABS/swe-bench/logs").rglob(
                  "test_output.txt"
              )
          )

          if len(outputs) != 1:
              raise RuntimeError(
                  f"Expected 1 test_output.txt, found {len(outputs)}"
              )

          text = outputs[0].read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Remove ANSI colour codes.
          clean = re.sub(
              r"\x1b\[[0-9;]*m",
              "",
              text
          )

          print("=== PYTEST RESULT ===")

          for line in clean.splitlines():
              if (
                  "collected " in line
                  or "PASSED " in line
                  or "FAILED " in line
                  or "ERROR " in line
                  or re.search(r"\d+ passed", line)
                  or re.search(r"\d+ failed", line)
              ):
                  print(line)

          if "collected 11 items" not in clean:
              raise RuntimeError(
                  "Expected 11 strengthened tests "
                  "were not collected"
              )

          if re.search(r"\bFAILED\b", clean):
              raise RuntimeError(
                  "At least one strengthened test failed"
              )

          if re.search(r"\bERROR\b", clean):
              raise RuntimeError(
                  "At least one strengthened test errored"
              )

          if not re.search(r"\b11 passed\b", clean):
              raise RuntimeError(
                  "Did not find final '11 passed' result"
              )

          print("")
          print("SMOKE TEST VERIFIED: 11/11 passed")
          PY

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweabs-final-smoke-evidence
          path: |
            one_prediction.jsonl
            gha_smoke.log
            SWE-ABS/swe-bench/logs/
