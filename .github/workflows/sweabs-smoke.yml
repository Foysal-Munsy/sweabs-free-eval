name: SWE-ABS Smoke Test

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone SWE-ABS
        run: |
          git clone --depth 1 https://github.com/OpenAgentEval/SWE-ABS.git

      - name: Fix patch application logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "SWE-ABS/swe-bench/swebench/harness/run_evaluation.py"
          )

          text = path.read_text()

          # Detect constant names used by this bundled SWE-bench version
          workdir = (
              "CONTAINER_WORKDIR"
              if "CONTAINER_WORKDIR" in text
              else "DOCKER_WORKDIR"
          )

          user = (
              "CONTAINER_USER"
              if "CONTAINER_USER" in text
              else "DOCKER_USER"
          )

          patch_file = (
              "CONTAINER_PATCH_FILE"
              if "CONTAINER_PATCH_FILE" in text
              else "DOCKER_PATCH"
          )

          # Replace old command list with safer current-style sequence
          cmd_start = text.index("GIT_APPLY_CMDS = [")
          cmd_end = text.index("]\n", cmd_start) + 2

          new_cmds = """GIT_APPLY_CMDS = [
              "git apply --verbose",
              "git apply --verbose --3way",
              "git apply --verbose --reject",
              "patch --batch --forward --fuzz=5 -p1 -i",
          ]
          """

          text = text[:cmd_start] + new_cmds + text[cmd_end:]

          # Replace the old patch-application block
          block_start = text.index(
              "        # Attempt to apply patch to container"
          )

          block_end = text.index(
              "        # Get git diff before running eval script",
              block_start
          )

          new_block = r'''        # Attempt to apply patch to container
          applied_patch = False

          for attempt, git_apply_cmd in enumerate(GIT_APPLY_CMDS):

              if attempt:
                  container.exec_run(
                      ["/bin/bash", "-c",
                       "git checkout -- . ; git clean -fd"],
                      workdir=__WORKDIR__,
                      user=__USER__,
                  )

              val = container.exec_run(
                  f"{git_apply_cmd} __PATCH__",
                  workdir=__WORKDIR__,
                  user=__USER__,
              )

              if val.exit_code == 0:
                  logger.info(
                      f"{APPLY_PATCH_PASS}:\n"
                      f"{val.output.decode('utf-8')}"
                  )
                  applied_patch = True
                  break

              logger.info(
                  f"Failed to apply patch to container: "
                  f"{git_apply_cmd}"
              )

          if not applied_patch:
              reverse_check = container.exec_run(
                  f"git apply --check --reverse __PATCH__",
                  workdir=__WORKDIR__,
                  user=__USER__,
              )

              if reverse_check.exit_code == 0:
                  logger.info(
                      f"{APPLY_PATCH_PASS}: verified already applied"
                  )
                  applied_patch = True

          if not applied_patch:
              logger.info(
                  f"{APPLY_PATCH_FAIL}:\n"
                  f"{val.output.decode('utf-8')}"
              )

              raise EvaluationError(
                  instance_id,
                  f"{APPLY_PATCH_FAIL}:\n"
                  f"{val.output.decode('utf-8')}",
                  logger,
              )

          '''

          new_block = (
              new_block
              .replace("__WORKDIR__", workdir)
              .replace("__USER__", user)
              .replace("__PATCH__", patch_file)
          )

          text = (
              text[:block_start]
              + new_block
              + text[block_end:]
          )

          path.write_text(text)

          # Syntax check
          compile(text, str(path), "exec")

          print("Harness patch applied successfully")
          print("workdir constant:", workdir)
          print("user constant:", user)
          print("patch constant:", patch_file)
          PY
          
      - name: Install SWE-bench harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ./SWE-ABS/swe-bench

      - name: Create exact prediction
        run: |
          python - <<'PY'
          import json
          from datasets import load_dataset

          ds = load_dataset(
              "tarsur385/swe-verified-gemini3-flash-trajectories",
              split="train"
          )

          rows = [
              r for r in ds
              if r["instance_id"] == "astropy__astropy-12907"
              and r["sample"] == 1
          ]

          assert len(rows) == 1
          r = rows[0]

          assert r["resolved"] is True
          assert r["patch"].strip()

          pred = {
              "instance_id": r["instance_id"],
              "model_name_or_path": "openhands-gemini3-flash-sample-1",
              "model_patch": r["patch"],
          }

          with open("one_prediction.jsonl", "w") as f:
              f.write(json.dumps(pred) + "\n")

          print("instance:", r["instance_id"])
          print("sample:", r["sample"])
          print("resolved:", r["resolved"])
          print("patch length:", len(r["patch"]))
          PY

      - name: Run SWE-ABS evaluation
        run: |
          set -o pipefail
          cd SWE-ABS/swe-bench

          python -m swebench.harness.run_evaluation \
            --dataset_name OpenAgentLab/SWE-Bench_Verified_ABS \
            --split test \
            --predictions_path ../../one_prediction.jsonl \
            --instance_ids astropy__astropy-12907 \
            --run_id gha_smoke_astropy_12907 \
            --max_workers 1 \
            --timeout 1800 \
            2>&1 | tee ../../gha_smoke.log

      - name: Show test output
        if: always()
        run: |
          echo "=== TEST OUTPUT FILES ==="
          find SWE-ABS/swe-bench/logs -name test_output.txt -print 2>/dev/null || true

          echo ""
          echo "=== PYTEST RESULT LINES ==="

          find SWE-ABS/swe-bench/logs -name test_output.txt -exec \
            grep -aE "PASSED|FAILED|ERROR|collected|passed in|failed in" {} \; \
            2>/dev/null || true
            
      - name: Show failure details
        if: always()
        run: |
          TEST_FILE=$(find SWE-ABS/swe-bench/logs -name test_output.txt | head -n 1)

          echo "=== FAILURE DETAILS ==="

          if [ -n "$TEST_FILE" ]; then
            sed -n '/=== FAILURES ===/,/short test summary info/p' "$TEST_FILE"
          else
            echo "No test_output.txt found"
          fi

      - name: Show failure details
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = list(Path("SWE-ABS/swe-bench/logs").rglob("test_output.txt"))

          print("=== FAILURE DETAILS ===")

          if not files:
              print("No test_output.txt found")
              raise SystemExit

          text = files[0].read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Remove ANSI colour codes
          text = re.sub(r"\x1b\[[0-9;]*m", "", text)

          start = text.find("=== FAILURES ===")
          end = text.find("short test summary info")

          if start == -1:
              print("No FAILURES section found")
          else:
              if end == -1:
                  end = len(text)

              print(text[start:end])
          PY
      
      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweabs-smoke-logs
          path: |
            gha_smoke.log
            SWE-ABS/swe-bench/logs/
