name: SWE-ABS Smoke Test

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone SWE-ABS
        run: |
          git clone --depth 1 https://github.com/OpenAgentEval/SWE-ABS.git

      - name: Backport safe patch retry logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "SWE-ABS/swe-bench/swebench/harness/run_evaluation.py"
          )

          lines = path.read_text().splitlines()

          # ---------------------------------------------------------
          # 1. Replace only GIT_APPLY_CMDS.
          #    Mirrors current official SWE-bench retry commands.
          # ---------------------------------------------------------

          cmd_start = next(
              i
              for i, line in enumerate(lines)
              if line.strip() == "GIT_APPLY_CMDS = ["
          )

          cmd_end = next(
              i
              for i in range(cmd_start + 1, len(lines))
              if lines[i].strip() == "]"
          )

          indent = (
              lines[cmd_start][
                  :len(lines[cmd_start])
                  - len(lines[cmd_start].lstrip())
              ]
          )

          lines[cmd_start:cmd_end + 1] = [
              indent + "GIT_APPLY_CMDS = [",
              indent + '    "git apply --verbose",',
              indent + '    "git apply --verbose --3way",',
              indent + '    "git apply --verbose --reject",',
              indent + '    "patch --batch --forward --fuzz=5 -p1 -i",',
              indent + "]",
          ]

          # ---------------------------------------------------------
          # 2. Find the existing retry loop.
          # ---------------------------------------------------------

          loop_index = next(
              i
              for i, line in enumerate(lines)
              if line.strip()
              == "for git_apply_cmd in GIT_APPLY_CMDS:"
          )

          loop_indent = (
              lines[loop_index][
                  :len(lines[loop_index])
                  - len(lines[loop_index].lstrip())
              ]
          )

          child_indent = loop_indent + "    "

          # Change:
          # for git_apply_cmd in ...
          #
          # to:
          # for attempt, git_apply_cmd in enumerate(...)
          lines[loop_index] = (
              loop_indent
              + "for attempt, git_apply_cmd "
              + "in enumerate(GIT_APPLY_CMDS):"
          )

          # ---------------------------------------------------------
          # 3. Before every retry, restore pristine repository state.
          # ---------------------------------------------------------

          reset_block = [
              child_indent + "if attempt:",
              child_indent + "    container.exec_run(",
              child_indent
              + '        ["/bin/bash", "-c", '
              + '"git checkout -- . ; git clean -fd"],',
              child_indent + "        workdir=DOCKER_WORKDIR,",
              child_indent + "        user=DOCKER_USER,",
              child_indent + "    )",
              "",
          ]

          lines[
              loop_index + 1:loop_index + 1
          ] = reset_block

          new_text = "\n".join(lines) + "\n"

          # ---------------------------------------------------------
          # 4. Safety checks before writing.
          # ---------------------------------------------------------

          assert '"git apply --verbose --3way"' in new_text
          assert (
              '"patch --batch --forward --fuzz=5 -p1 -i"'
              in new_text
          )
          assert (
              "for attempt, git_apply_cmd "
              "in enumerate(GIT_APPLY_CMDS):"
              in new_text
          )
          assert "git checkout -- . ; git clean -fd" in new_text

          # Verify resulting source is valid Python.
          compile(new_text, str(path), "exec")

          path.write_text(new_text)

          print("Safe retry logic installed: OK")
          print("Python syntax check: OK")

          # ---------------------------------------------------------
          # 5. Print only relevant modified source.
          # ---------------------------------------------------------

          final_lines = new_text.splitlines()

          print("")
          print("=== MODIFIED GIT_APPLY_CMDS ===")

          for i, line in enumerate(final_lines, start=1):
              if line.strip() == "GIT_APPLY_CMDS = [":
                  for n in range(i, min(i + 7, len(final_lines) + 1)):
                      print(f"{n:4}: {final_lines[n-1]}")
                  break

          print("")
          print("=== MODIFIED RETRY LOOP ===")

          for i, line in enumerate(final_lines, start=1):
              if (
                  "for attempt, git_apply_cmd "
                  "in enumerate(GIT_APPLY_CMDS):"
                  in line
              ):
                  start = max(1, i - 2)
                  end = min(len(final_lines), i + 22)

                  for n in range(start, end + 1):
                      print(f"{n:4}: {final_lines[n-1]}")

                  break
          PY

      - name: Install SWE-bench harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ./SWE-ABS/swe-bench

      - name: Create exact prediction
        run: |
          python - <<'PY'
          import json
          from datasets import load_dataset

          ds = load_dataset(
              "tarsur385/swe-verified-gemini3-flash-trajectories",
              split="train"
          )

          rows = [
              r for r in ds
              if r["instance_id"] == "astropy__astropy-12907"
              and r["sample"] == 1
          ]

          assert len(rows) == 1

          r = rows[0]

          assert r["resolved"] is True
          assert r["patch"].strip()

          pred = {
              "instance_id": r["instance_id"],
              "model_name_or_path":
                  "openhands-gemini3-flash-sample-1",
              "model_patch": r["patch"],
          }

          with open("one_prediction.jsonl", "w") as f:
              f.write(json.dumps(pred) + "\n")

          print("instance:", r["instance_id"])
          print("sample:", r["sample"])
          print("standard resolved:", r["resolved"])
          print("patch length:", len(r["patch"]))
          PY

      - name: Run SWE-ABS evaluation
        run: |
          set -o pipefail

          cd SWE-ABS/swe-bench

          python -m swebench.harness.run_evaluation \
            --dataset_name OpenAgentLab/SWE-Bench_Verified_ABS \
            --split test \
            --predictions_path ../../one_prediction.jsonl \
            --instance_ids astropy__astropy-12907 \
            --run_id gha_smoke_astropy_12907_fixed \
            --max_workers 1 \
            --timeout 1800 \
            2>&1 | tee ../../gha_smoke.log

      - name: Verify intended patch before tests
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(
              Path("SWE-ABS/swe-bench/logs").rglob(
                  "run_instance.log"
              )
          )

          if not files:
              raise RuntimeError(
                  "run_instance.log not found"
              )

          log_file = files[0]

          text = log_file.read_text(
              encoding="utf-8",
              errors="replace"
          )

          print("RUN LOG:")
          print(log_file)

          start = text.find("Git diff before:")
          end = text.find(
              "Eval script for",
              start
          )

          if start == -1:
              raise RuntimeError(
                  "Git diff before section not found"
              )

          if end == -1:
              end = len(text)

          diff_before = text[start:end]

          print("")
          print("=== GIT DIFF BEFORE TESTS ===")
          print(diff_before)

          expected_file = (
              "diff --git "
              "a/astropy/modeling/separable.py "
              "b/astropy/modeling/separable.py"
          )

          expected_change = (
              "cright[-right.shape[0]:, "
              "-right.shape[1]:] = right"
          )

          if expected_file not in diff_before:
              raise RuntimeError(
                  "FAIL: separable.py is NOT present "
                  "in Git diff before tests"
              )

          if expected_change not in diff_before:
              raise RuntimeError(
                  "FAIL: intended '= right' change "
                  "is NOT active before tests"
              )

          print("")
          print(
              "VERIFIED: separable.py intended "
              "change is active before tests"
          )
          PY

      - name: Show patch application section
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(
              Path("SWE-ABS/swe-bench/logs").rglob(
                  "run_instance.log"
              )
          )

          if not files:
              print("No run_instance.log found")
              raise SystemExit

          text = files[0].read_text(
              encoding="utf-8",
              errors="replace"
          )

          start = text.find(
              "Intermediate patch for"
          )

          end = text.find(
              "Eval script for",
              start
          )

          if start == -1:
              print(
                  "Patch application section not found"
              )
              raise SystemExit

          if end == -1:
              end = len(text)

          print(
              "=== PATCH APPLICATION SECTION ==="
          )
          print(text[start:end])
          PY

      - name: Show pytest summary
        if: always()
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path("SWE-ABS/swe-bench/logs").rglob(
                  "test_output.txt"
              )
          )

          print("=== PYTEST SUMMARY ===")

          if not files:
              print("No test_output.txt found")
              raise SystemExit

          text = files[0].read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Strip ANSI colour codes.
          text = re.sub(
              r"\x1b\[[0-9;]*m",
              "",
              text
          )

          for line in text.splitlines():
              if (
                  "collected " in line
                  or " PASSED " in line
                  or " FAILED " in line
                  or " ERROR " in line
                  or re.search(
                      r"\d+ passed",
                      line
                  )
                  or re.search(
                      r"\d+ failed",
                      line
                  )
              ):
                  print(line)
          PY

      - name: Show final run report
        if: always()
        run: |
          LOG_FILE="$(
            find SWE-ABS/swe-bench/logs \
              -name run_instance.log \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "$LOG_FILE" ]; then
            echo "No run_instance.log found"
            exit 0
          fi

          echo "=== FINAL REPORT LINES ==="

          grep -aE \
            "report:|Result for|resolved:" \
            "$LOG_FILE" \
            || true

      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweabs-smoke-logs-fixed
          path: |
            gha_smoke.log
            SWE-ABS/swe-bench/logs/
