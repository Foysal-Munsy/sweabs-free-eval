name: Step 11 - Static and unittest collection of missing Oracle method
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-django-collection.yml"
permissions:
  contents: read
jobs:
  source-and-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
      - name: Reconstruct exact original agent plus original SWE-ABS tests
        run: |
          python scripts/step11_django_backend_probe.py prepare \
            --task django__django-15503 --sample 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install source of pinned Django task
        run: python -m pip install -e ./scratch/step11-django-15503-sample1/django
      - name: Enumerate AST and module unittest discovery with registered Django test apps
        run: python scripts/step11_django_collection_probe.py --sample 1
      - name: Preserve historical v2 and frozen analysis
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv
