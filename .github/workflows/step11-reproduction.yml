name: Step 11 - Independent reproduction (read-only)

on:
  workflow_dispatch:
    inputs:
      repeat_short_retention_checks:
        description: "Re-download original ZIPs for archival re-audit (uses GitHub artifact egress; normally OFF)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-reproduction.yml"
      - "scripts/step9_extract_trajectory_features.py"
      - "scripts/step10_analyze_frozen_features.py"
      - "scripts/step11_robustness.py"
      - "tests/test_step9_indicators.py"
      - "scripts/step11_trace_spotcheck.py"
      - "scripts/step11_semantic_structural_audit.py"
      - "scripts/step11_raw_artifact_reaudit14.py"
      - "scripts/step11_skip_attribution.py"
      - "scripts/step11_inplace_method_audit.py"
      - "scripts/step11_missing_oracle_method_audit.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: step11-reproduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print environment and dataset package versions
        run: |
          python --version
          python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
          python - <<'PY'
          import datasets, huggingface_hub
          print("datasets", datasets.__version__)
          print("huggingface_hub", huggingface_hub.__version__)
          PY
      - name: Verify frozen indicator parser on synthetic trace fixtures
        run: python -m unittest discover -s tests -p test_step9_indicators.py -v
      - name: Independently reproduce archived Step 10 AUROC output
        run: python scripts/step10_analyze_frozen_features.py --check
      - name: Independently reproduce archived Step 11 task-aware robustness output
        run: python scripts/step11_robustness.py --check
      - name: Independently reproduce exact-match Step 9 output using pinned Hugging Face revision
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/step9_extract_trajectory_features.py --check
      - name: Independently recount 12 pinned raw trajectories
        run: |
          python scripts/step11_trace_spotcheck.py
          python scripts/step11_trace_spotcheck.py --check
          echo 'STEP11_TRACE_JSON_BEGIN'
          cat results/2026-11-12/STEP11_TRACE_SPOTCHECK_12_v1.json
          echo 'STEP11_TRACE_JSON_END'
      - name: Independently match 31 FAIL + 14 UNVERIFIED to pinned original/test diffs
        run: |
          python scripts/step11_semantic_structural_audit.py
          if [ -f results/2026-11-12/STEP11_SEMANTIC_STRUCTURAL_CROSSWALK_v1.json ]; then
            echo 'STEP11_STRUCTURAL_CROSSWALK_BEGIN'
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/2026-11-12/STEP11_SEMANTIC_STRUCTURAL_CROSSWALK_v1.json")
          d=json.loads(p.read_text(encoding="utf8"))
          print(json.dumps(d,sort_keys=True,separators=(",",":")))
          PY
            echo 'STEP11_STRUCTURAL_CROSSWALK_END'
          fi
      - name: Fresh per-patch ZIP inspection for all 14 UNVERIFIED
        if: github.event_name == 'workflow_dispatch' && inputs.repeat_short_retention_checks == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/step11_raw_artifact_reaudit14.py
          echo 'STEP11_RAW_ZIP_AUDIT_BEGIN'
          cat results/2026-11-12/STEP11_RAW_ARTIFACT_REAUDIT14_v1.json
          echo 'STEP11_RAW_ZIP_AUDIT_END'
      - name: Attribute nine skipped runs to newly added augmented test method names
        if: github.event_name == 'workflow_dispatch' && inputs.repeat_short_retention_checks == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/step11_skip_attribution.py
          echo 'STEP11_SKIP_ATTRIBUTION_BEGIN'
          cat results/2026-11-12/STEP11_SKIP_ATTRIBUTION_9_v1.json
          echo 'STEP11_SKIP_ATTRIBUTION_END'
      - name: Attribute Django-14434 inserted assertions in existing methods using pinned Django base
        if: github.event_name == 'workflow_dispatch' && inputs.repeat_short_retention_checks == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/step11_inplace_method_audit.py
          echo 'STEP11_INPLACE_DJANGO14434_BEGIN'
          cat results/2026-11-12/STEP11_INPLACE_METHOD_AUDIT_DJANGO14434_v1.json
          echo 'STEP11_INPLACE_DJANGO14434_END'
      - name: Inspect declared but unobserved Django-15503 Oracle test method
        # By default, consult independently verified immutable ZIP/method ledgers
        # instead of repeating fragile high-egress artifact downloads.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/step11_missing_oracle_method_audit.py
          echo 'STEP11_ORACLE_METHOD_BEGIN'
          cat results/2026-11-12/STEP11_MISSING_DJANGO15503_ORACLE_METHOD_v1.json
          echo 'STEP11_ORACLE_METHOD_END'
      - name: Assert the verification workflow did not modify source evidence
        run: |
          git diff --exit-code -- results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv \
            results/2026-11-12/STEP9_TRAJECTORY_FEATURES_v1.csv \
            results/2026-11-12/STEP10_AUROC_TASK_CLUSTER_v2.json \
            results/2026-11-12/STEP11_EXPLORATORY_ROBUSTNESS_v1.json
