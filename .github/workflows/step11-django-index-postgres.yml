name: Step 11 - Django PostgreSQL index augmented coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-django-index-postgres.yml"
permissions:
  contents: read
jobs:
  targeted-index-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2, 3]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load frozen original agent and enhanced test sources
        run: python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
      - name: Reconstruct exact model patch and strengthened tests on pinned base
        run: |
          python scripts/step11_django_backend_probe.py prepare \
            --task django__django-12039 --sample ${{ matrix.sample }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pinned Django snapshot and PostgreSQL adapter
        run: |
          python -m pip install -e "./scratch/step11-django-12039-sample${{ matrix.sample }}/django"
          python -m pip install 'psycopg2-binary==2.9.9'
      - name: Run entire new augmented index whitespace module against supported database
        run: |
          python scripts/step11_django_backend_probe.py execute \
            --task django__django-12039 --sample ${{ matrix.sample }}
      - name: Check old v2 outcomes are preserved
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv
