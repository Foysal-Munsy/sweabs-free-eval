name: Step 11 - Django JSON Oracle method on PostgreSQL (new evidence)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-django-json-postgres.yml"
permissions:
  contents: read
jobs:
  targeted-oracle-method:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2, 3]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen data source dependencies
        run: python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
      - name: Reconstruct exact submitted Django-15503 patch and original augmented tests
        run: |
          python scripts/step11_django_backend_probe.py prepare \
            --task django__django-15503 --sample ${{ matrix.sample }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install historically compatible Django and PostgreSQL driver
        run: |
          python -m pip install -e "./scratch/step11-django-15503-sample${{ matrix.sample }}/django"
          python -m pip install 'psycopg2-binary==2.9.9'
      - name: Independently execute exact formerly absent Oracle method on PostgreSQL
        run: |
          python scripts/step11_django_backend_probe.py execute \
            --task django__django-15503 --sample ${{ matrix.sample }}
      - name: Preserve original research evidence
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv
