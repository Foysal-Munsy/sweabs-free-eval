name: Step 12 - Frozen qualitative case and source recount audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step12-qualitative-audit.yml"
      - "scripts/step12_cases.py"
      - "docs/STEP12_CASE_SELECTION_PROTOCOL_v1.md"
      - "results/2026-11-13/STEP12_CASE_ROSTER_v1.json"

permissions:
  contents: read

concurrency:
  group: step12-qualitative-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dataset reader
        run: python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
      - name: Recompute all eight roster identities from frozen data
        run: python scripts/step12_cases.py --check
      - name: Independently recount eight exact original raw trajectories
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/step12_cases.py --check --recount-source
      - name: Assert historical labels/features not modified by analysis
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv \
            results/2026-11-12/STEP9_TRAJECTORY_FEATURES_v1.csv \
            docs/STEP8_FROZEN_INDICATORS_v1.md
