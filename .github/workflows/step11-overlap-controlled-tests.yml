name: Step 11 - Controlled tests on original patch-preserving merges
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-overlap-controlled-tests.yml"
permissions:
  contents: read
jobs:
  run-merged-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: sympy__sympy-23413
            sample: 1
          - task: sympy__sympy-23413
            sample: 2
          - task: sympy__sympy-23413
            sample: 3
          - task: django__django-11206
            sample: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read pinned agent and SWE-ABS test records
        run: python -m pip install 'datasets==4.8.5' 'huggingface_hub==1.33.0'
      - name: Prepare non-destructive exact original patch and enhanced tests
        run: |
          python scripts/step11_overlap_execution.py prepare \
            --task ${{ matrix.task }} --sample ${{ matrix.sample }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install compatible upstream source and test dependencies
        run: |
          DIR="scratch/step11-merge-${{ matrix.task == 'sympy__sympy-23413' && '23413' || '11206' }}-s${{ matrix.sample }}/repo"
          python -m pip install -e "./$DIR"
          if [ "${{ matrix.task }}" = "sympy__sympy-23413" ]; then
            python -m pip install 'pytest==7.4.4' 'mpmath==1.3.0'
          fi
      - name: Execute targeted originally colliding augmented tests and retain all original model edits
        run: |
          python scripts/step11_overlap_execution.py execute \
            --task ${{ matrix.task }} --sample ${{ matrix.sample }}
      - name: Verify no frozen runner or analysis source modification
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv
