name: Step 11 - Frozen controlled execution evidence reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/step11-final-evidence.yml"
permissions:
  contents: read
jobs:
  aggregate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile exact controlled PostgreSQL/merged original agent patch results
        run: |
          python scripts/step11_freeze_controlled_evidence.py
          python scripts/step11_freeze_controlled_evidence.py --check
          echo 'STEP11_FINAL_EVIDENCE_BEGIN'
          cat results/2026-11-12/STEP11_CONTROLLED_EVIDENCE_FREEZE_v1.json
          echo 'STEP11_FINAL_EVIDENCE_END'
      - name: Assert historical labels and analysis unchanged
        run: |
          git diff --exit-code -- results/2026-11-12/sweabs_full_198_cumulative_v2.csv \
            results/2026-11-12/STEP7_ANALYSIS_LABELS_v1.csv
